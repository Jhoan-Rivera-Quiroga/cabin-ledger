<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ---------- configuration ---------- */

const APP_NAME = 'Cabin Ledger';
const CURRENCY = 'COP';

/* Leave both empty to run in LOCAL MODE: data is saved in this browser only (fine for trying
   it out or for a single computer). Fill both in to store data in your own Supabase project
   so every device sees the same bookings -- see cabin-schema.sql and CABIN_NOTES.md. */
const SUPABASE_URL = 'https://ozvxqfkraskcxbxkrdoc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96dnhxZmtyYXNrY3hieGtyZG9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMDY1MjcsImV4cCI6MjEwODg4MjUyN30.ZrwTOO0z1hdmSBpwfoHJpwpb5qxH07yDk-7j6Bu3uDY';

/* The cabin's own time zone, an IANA name such as 'America/Bogota' or 'Europe/Madrid'. "Today" is read in this
   zone so a late-evening entry isn't dated tomorrow. Empty = use the device clock. */
const TIME_ZONE = 'America/Bogota';

const NAV = [
  { id: 'dashboard', label: 'Resumen', icon: 'Dashboard' },
  { id: 'bookings', label: 'Reservas', icon: 'Bed' },
  { id: 'expenses', label: 'Gastos', icon: 'Receipt' },
  { id: 'records', label: 'Registros', icon: 'Table' },
  { id: 'settings', label: 'Ajustes', icon: 'Gear' },
];

// The app manages a single cabin; every new booking is saved under this name (the database column is kept).
const CABIN = 'Cabaña';

// Lists and entries saved before the app was in Spanish hold the English default names; they are read as the Spanish ones
// (and saved that way the next time they are written). Names the owner typed in are left alone.
const OLD_NAMES = {
  'Cash': 'Efectivo', 'Bank transfer': 'Transferencia bancaria', 'Card': 'Tarjeta', 'Mobile payment': 'Nequi / Daviplata', 'Platform payout': 'Pago de la plataforma',
  'Direct': 'Directo', 'Phone / WhatsApp': 'Teléfono / WhatsApp', 'Referral': 'Referido',
  'Cleaning & laundry': 'Aseo y lavandería', 'Firewood & heating': 'Leña y calefacción', 'Utilities': 'Servicios públicos', 'Maintenance & repairs': 'Mantenimiento y reparaciones',
  'Supplies & amenities': 'Insumos y amenidades', 'Insurance & taxes': 'Seguros e impuestos', 'Marketing': 'Publicidad', 'Other': 'Otro',
};
const es = (name) => OLD_NAMES[name] || name;

const DEFAULTS = {
  payment_methods: ['Efectivo', 'Transferencia bancaria', 'Tarjeta', 'Nequi / Daviplata', 'Pago de la plataforma', 'Otro'],
  channels: ['Directo', 'Airbnb', 'Booking.com', 'Teléfono / WhatsApp', 'Referido'],
  categories: ['Aseo y lavandería', 'Leña y calefacción', 'Servicios públicos', 'Mantenimiento y reparaciones', 'Insumos y amenidades', 'Seguros e impuestos', 'Publicidad', 'Otro'],
};

const C = {
  paper: 'var(--paper)', panel: 'var(--panel)', ink: 'var(--ink)', inkSoft: 'var(--ink-soft)',
  forest: 'var(--forest)', forestSoft: 'var(--forest-soft)', clay: 'var(--clay)', claySoft: 'var(--clay-soft)',
  timber: 'var(--timber)', timberSoft: 'var(--timber-soft)', line: 'var(--line)',
};

const MONTH_NAMES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

/* ---------- date + money helpers (all dates are 'YYYY-MM-DD' strings, handled in UTC to dodge DST) ---------- */

const DAY_MS = 86400000;
const pad2 = (n) => String(n).padStart(2, '0');
const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const toISO = (ms) => new Date(ms).toISOString().slice(0, 10);
const addDays = (s, n) => toISO(parseISO(s) + n * DAY_MS);
const nightsBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / DAY_MS);
function todayISO() {
  if (TIME_ZONE) return new Date().toLocaleDateString('en-CA', { timeZone: TIME_ZONE }); // en-CA formats as YYYY-MM-DD
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
const daysInMonth = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate(); // m is 1-based
function fmtDate(s) { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); return `${d} ${MONTH_NAMES[m - 1]} ${y}`; }
function fmtShort(s) { const [, m, d] = s.split('-').map(Number); return `${d} ${MONTH_NAMES[m - 1]}`; }

function fmtMoney(n) {
  return (Number(n) || 0).toLocaleString('es-CO', { style: 'currency', currency: CURRENCY, maximumFractionDigits: 0 });
}
function cssVar(name, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}
function resolveColor(c) {
  const m = /^var\((--[^)]+)\)$/.exec(c);
  return m ? cssVar(m[1], '#888') : c;
}
function addMonths(monthKey, n) {
  const [y, m] = monthKey.split('-').map(Number);
  const d = new Date(Date.UTC(y, m - 1 + n, 1));
  return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}`;
}
/** Splits an expense into monthly shares (for things like an annual insurance premium). The rounding
 *  remainder lands in the last month so the shares always add up to the original amount. */
function explodeExpense(r) {
  const months = r.accrualMonths && r.accrualMonths > 1 ? r.accrualMonths : 1;
  const startKey = r.date.slice(0, 7);
  const day = Number(r.date.slice(8, 10));
  const base = Math.floor(r.amount / months);
  const remainder = r.amount - base * months;
  const rows = [];
  for (let i = 0; i < months; i++) {
    const month = addMonths(startKey, i);
    const [y, m] = month.split('-').map(Number);
    rows.push({ month, date: `${month}-${pad2(Math.min(day, daysInMonth(y, m)))}`, amount: i === months - 1 ? base + remainder : base });
  }
  return rows;
}

/* ---------- booking maths ---------- */

const bookingNights = (b) => Math.max(0, nightsBetween(b.checkIn, b.checkOut));
const bookingAvgNight = (b) => (bookingNights(b) ? Math.round(b.total / bookingNights(b)) : 0);
/** The booking total spread over its nights: an even split, with the rounding remainder on the last night. */
function nightShares(b) {
  const n = bookingNights(b);
  if (!n) return [];
  const base = Math.floor(b.total / n);
  return Array.from({ length: n }, (_, i) => ({ date: addDays(b.checkIn, i), amount: i === n - 1 ? b.total - base * (n - 1) : base }));
}
function findConflict(bookings, cand, ignoreId) {
  return bookings.find((b) => b.id !== ignoreId &&b.checkIn < cand.checkOut && cand.checkIn < b.checkOut) || null;
}

/* ---------- chart periods: week (Sun-Sat), month, year ---------- */

const PERIODS = [['week', 'Semanal'], ['month', 'Mensual'], ['year', 'Anual']];
const weekday = (d) => new Date(parseISO(d)).getUTCDay(); // 0 = Sunday
/** First day of the period that contains date d. */
function periodStart(d, period) {
  if (period === 'week') return addDays(d, -weekday(d));
  if (period === 'year') return d.slice(0, 4) + '-01-01';
  return d.slice(0, 7) + '-01';
}
function nextPeriod(p, period) {
  if (period === 'week') return addDays(p, 7);
  if (period === 'year') return `${Number(p.slice(0, 4)) + 1}-01-01`;
  return addMonths(p.slice(0, 7), 1) + '-01';
}
/** Number of the Sun-Sat week containing date d, counted in d's year: W1 is the week that contains January 1st. */
function weekNumber(d) {
  const jan1 = d.slice(0, 4) + '-01-01';
  return Math.floor((nightsBetween(jan1, d) + weekday(jan1)) / 7) + 1;
}
/** A week is numbered by its Saturday, so a week crossing New Year is W1 of the new year -- unless the date range
 *  ends before that Saturday, in which case it is the last week (W53) of the year being shown. */
const weekRef = (p, end) => { const sat = addDays(p, 6); return sat > end ? end : sat; };
function periodLabel(p, period, multiYear, end) {
  if (period === 'year') return p.slice(0, 4);
  if (period === 'week') { const r = weekRef(p, end); return `W${weekNumber(r)}` + (multiYear ? ` '${r.slice(2, 4)}` : ''); }
  return MONTH_NAMES[Number(p.slice(5, 7)) - 1] + (multiYear ? ` '${p.slice(2, 4)}` : '');
}
/** Longer name for the chart tooltip, e.g. "W5 · 25 Ene – 31 Ene 2026". */
function periodTitle(p, period, end) {
  if (period === 'year') return p.slice(0, 4);
  if (period === 'week') return `W${weekNumber(weekRef(p, end))} · ${fmtShort(p)} – ${fmtDate(addDays(p, 6))}`;
  return `${MONTH_NAMES[Number(p.slice(5, 7)) - 1]} ${p.slice(0, 4)}`;
}

/** Everything the dashboard shows for the chosen date range (empty from/to = everything on record), with the
 *  chart series grouped by `period`. Revenue is recognised per night (a stay that crosses a period end is split). */
function computeRange(bookings, expenses, from, to, cabinCount, today, period = 'month') {
  const all = [];
  bookings.forEach((b) => { all.push(b.checkIn, addDays(b.checkOut, -1)); });
  expenses.forEach((e) => explodeExpense(e).forEach((s) => all.push(s.date)));
  all.sort();
  const start = from || all[0] || today;
  const end = to || all[all.length - 1] || today;
  if (start > end) return null;

  const keys = [];
  for (let k = periodStart(start, period); k <= end && keys.length < 600; k = nextPeriod(k, period)) keys.push(k);
  const idx = {}; keys.forEach((k, i) => { idx[k] = i; });
  const slot = (d) => idx[periodStart(d, period)];
  const rev = Array(keys.length).fill(0), exp = Array(keys.length).fill(0), nights = Array(keys.length).fill(0);
  let nightsToDate = 0, lodgingToDate = 0;
  const chan = {};

  bookings.forEach((b) => {
    nightShares(b).forEach(({ date: d, amount }) => {
      const i = slot(d);
      if (d < start || d > end || i === undefined) return;
      rev[i] += amount; nights[i] += 1;
      chan[b.channel || 'Sin canal'] = (chan[b.channel || 'Sin canal'] || 0) + amount;
      if (d <= today) { nightsToDate += 1; lodgingToDate += amount; }
    });
  });
  expenses.forEach((e) => explodeExpense(e).forEach((s) => {
    const i = slot(s.date);
    if (s.date < start || s.date > end || i === undefined) return;
    exp[i] += s.amount;
  }));

  const sum = (a) => a.reduce((x, y) => x + y, 0);
  const cabins = Math.max(1, cabinCount);
  const elapsedEnd = end < today ? end : today;
  const elapsed = elapsedEnd >= start ? nightsBetween(start, elapsedEnd) + 1 : 0;
  const multiYear = start.slice(0, 4) !== end.slice(0, 4);
  // Occupancy per period counts only the days of that period inside the From/To range.
  const occ = keys.map((k, i) => {
    const a = k > start ? k : start;
    const last = addDays(nextPeriod(k, period), -1);
    const z = last < end ? last : end;
    const days = nightsBetween(a, z) + 1;
    return Math.round((nights[i] / (days * cabins)) * 1000) / 10;
  });
  return {
    start, end,
    labels: keys.map((k) => periodLabel(k, period, multiYear, end)), titles: keys.map((k) => periodTitle(k, period, end)),
    rev, exp, occ,
    byChannel: Object.entries(chan).sort((a, b) => b[1] - a[1]),
    revenue: sum(rev), expenses: sum(exp),
    occupancy: elapsed ? Math.round((nightsToDate / (elapsed * cabins)) * 1000) / 10 : null,
    adr: nightsToDate ? Math.round(lodgingToDate / nightsToDate) : null,
    nightsToDate,
  };
}

/* ---------- storage: browser (local mode) or Supabase ---------- */

const sb = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const LS_PREFIX = 'cabinledger:';
const newId = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
const lsRead = (key, fallback) => { try { const v = localStorage.getItem(LS_PREFIX + key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } };
const lsWrite = (key, value) => { try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); return null; } catch (e) { return { message: 'No se pudo guardar en este navegador (almacenamiento lleno o bloqueado).' }; } };
const LOCAL_KEYS = ['bookings', 'expenses', 'config'];

const store = sb ? {
  async list(table, col) { const { data, error } = await sb.from(table).select('*').order(col, { ascending: true }); return { data: data || [], error }; },
  async insert(table, rows) { const { error } = await sb.from(table).insert(rows); return error; },
  async update(table, id, row) { const { error } = await sb.from(table).update(row).eq('id', id); return error; },
  async remove(table, id) { const { error } = await sb.from(table).delete().eq('id', id); return error; },
  // A failed read must never look like "nothing saved yet" (that would trigger seeding defaults over real data), so the error is returned.
  async getConfig(key) { const { data, error } = await sb.from('config').select('items').eq('key', key).maybeSingle(); return { items: data ? data.items : null, error }; },
  async setConfig(key, items) { const { error } = await sb.from('config').upsert({ key, items }); return error; },
} : {
  async list(table, col) { return { data: lsRead(table, []).sort((a, b) => String(a[col] || '').localeCompare(String(b[col] || ''))), error: null }; },
  async insert(table, rows) { return lsWrite(table, [...lsRead(table, []), ...rows.map((r) => ({ ...r, id: newId() }))]); },
  async update(table, id, row) { return lsWrite(table, lsRead(table, []).map((r) => (r.id === id ? { ...row, id } : r))); },
  async remove(table, id) { return lsWrite(table, lsRead(table, []).filter((r) => r.id !== id)); },
  async getConfig(key) { return { items: lsRead('config', {})[key] || null, error: null }; },
  async setConfig(key, items) { return lsWrite('config', { ...lsRead('config', {}), [key]: items }); },
};

/* snake_case database rows <-> camelCase app records */
// Rows saved by the first version (nightly_rate + cleaning_fee) are converted to a total when read, so nothing already entered is lost.
const bookingFromDb = (r) => ({ id: r.id, guest: r.guest, phone: r.phone || '', cabin: r.cabin, checkIn: r.check_in, checkOut: r.check_out, guests: r.guests,
  total: r.total != null ? r.total : (r.nightly_rate || 0) * Math.max(0, nightsBetween(r.check_in, r.check_out)) + (r.cleaning_fee || 0),
  channel: es(r.channel || ''), paymentMethod: es(r.payment_method || ''), notes: r.notes || '' });
const bookingToDb = (b) => ({ guest: b.guest, phone: b.phone || null, cabin: b.cabin, check_in: b.checkIn, check_out: b.checkOut, guests: b.guests, total: b.total, channel: b.channel || null, payment_method: b.paymentMethod || null, notes: b.notes || null });
const expenseFromDb = (r) => ({ id: r.id, date: r.date, category: es(r.category), description: r.description, amount: r.amount, ...(r.accrual_months ? { accrualMonths: r.accrual_months } : {}) });
const expenseToDb = (e) => ({ date: e.date, category: e.category, description: e.description, amount: e.amount, accrual_months: e.accrualMonths || null });

/* Saving rules (so the app never implies something was saved when it wasn't):
   - with a remote database, every write is refused up front while offline;
   - lists and tables only update after the database confirms the write (no optimistic updates);
   - a failed write returns its error to the form, which stays open with the data still in it;
   - a failed read is reported through onLoadError and is never treated as "no data". */
const OFFLINE_MSG = 'Sin conexión a internet: no se guardó nada.';
const isOffline = () => !!sb && !navigator.onLine;
// Supabase answers in English; the messages people are likely to see are translated, anything else is shown as is.
const SERVER_MESSAGES = {
  'Invalid login credentials': 'Correo o contraseña incorrectos.',
  'Email not confirmed': 'Este correo aún no está confirmado.',
  'Failed to fetch': 'No se pudo conectar con el servidor.',
};
const errMsg = (e) => (e && e.message && (SERVER_MESSAGES[e.message] || e.message)) || 'Algo salió mal: no se guardó nada.';
const TABLE_NAMES = { bookings: 'las reservas', expenses: 'los gastos' };
const LIST_NAMES = { payment_methods: 'medios de pago', channels: 'canales', categories: 'categorías' };

function useTable(table, fromDb, toDb, orderCol, onError, onLoadError, tick) {
  const [items, setItems] = useState([]);
  const refresh = useCallback(async () => {
    let res;
    try { res = await store.list(table, orderCol); } catch (e) { res = { error: e }; }
    if (res.error) { onLoadError(table, `No se pudieron cargar ${TABLE_NAMES[table] || table}: ${errMsg(res.error)}`); return; }
    onLoadError(table, '');
    setItems(res.data.map(fromDb));
  }, [table, orderCol]);
  useEffect(() => { refresh(); }, [refresh, tick]);

  const run = useCallback(async (op) => {
    if (isOffline()) { onError(OFFLINE_MSG); return { message: OFFLINE_MSG }; }
    let error;
    try { error = await op(); } catch (e) { error = e; }
    if (error) { onError(errMsg(error)); return { message: errMsg(error) }; }
    await refresh();
    return null;
  }, [refresh, onError]);

  return {
    items, refresh,
    add: (rec) => run(() => store.insert(table, [toDb(rec)])),
    save: (id, rec) => run(() => store.update(table, id, toDb(rec))),
    remove: (id) => run(() => store.remove(table, id)),
  };
}

/** Returns [items, add, remove, replaceAll] for one managed list stored in `config`. */
function useConfigList(key, onError, onLoadError, tick) {
  const [items, setItems] = useState([]);
  const ref = useRef(items);
  ref.current = items;
  useEffect(() => {
    let alive = true;
    (async () => {
      let res;
      try { res = await store.getConfig(key); } catch (e) { res = { items: null, error: e }; }
      if (!alive) return;
      // Only seed the defaults when the read SUCCEEDED and found nothing; a failed read must not overwrite real data.
      if (res.error) { onLoadError(key, `No se pudo cargar la lista de ${LIST_NAMES[key] || key}: ${errMsg(res.error)}`); return; }
      if (res.items) { onLoadError(key, ''); setItems([...new Set(res.items.map(es))]); return; }
      const seed = DEFAULTS[key] || [];
      let err; try { err = await store.setConfig(key, seed); } catch (e) { err = e; }
      if (!alive) return;
      if (err) { onLoadError(key, `No se pudo crear la lista de ${LIST_NAMES[key] || key}: ${errMsg(err)}`); return; }
      onLoadError(key, ''); setItems(seed);
    })();
    return () => { alive = false; };
  }, [key, tick]);
  // Resolves to an error object on failure, null on success; the list on screen changes only after the write is confirmed.
  const write = async (next) => {
    if (isOffline()) { onError(OFFLINE_MSG); return { message: OFFLINE_MSG }; }
    let err; try { err = await store.setConfig(key, next); } catch (e) { err = e; }
    if (err) { onError(errMsg(err)); return { message: errMsg(err) }; }
    setItems(next);
    return null;
  };
  return [items, (name) => write([...ref.current, name]), (name) => write(ref.current.filter((i) => i !== name)), write];
}

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function ChartCanvas({ type, labels, titles, datasets, money, percent }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    const inkSoft = cssVar('--ink-soft', '#666'), line = cssVar('--line', '#ddd');
    chartRef.current = new Chart(canvasRef.current, {
      type,
      data: {
        labels,
        datasets: datasets.map((d) => ({
          label: d.label, data: d.values, borderColor: resolveColor(d.color),
          backgroundColor: type === 'line' ? 'transparent' : resolveColor(d.color),
          borderWidth: type === 'line' ? 2 : 0, borderRadius: type === 'bar' ? 3 : 0, tension: 0.3, pointRadius: labels.length < 3 ? 4 : 0, maxBarThickness: 28, // a line needs dots when there are only one or two points
        })),
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: datasets.length > 1, labels: { color: inkSoft, boxWidth: 12, font: { size: 11 } } },
          tooltip: { callbacks: { ...(titles ? { title: (items) => (items.length ? titles[items[0].dataIndex] : '') } : {}), label: (ctx) => `${ctx.dataset.label ? ctx.dataset.label + ': ' : ''}${money ? fmtMoney(ctx.parsed.y) : percent ? ctx.parsed.y + '%' : ctx.parsed.y}` } },
        },
        scales: {
          x: { ticks: { color: inkSoft, font: { size: 11 } }, grid: { display: false } },
          y: { beginAtZero: true, max: percent ? 100 : undefined, ticks: { color: inkSoft, font: { size: 11 }, callback: money ? (v) => fmtMoney(v) : percent ? (v) => v + '%' : undefined }, grid: { color: line } },
        },
      },
    });
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
    // eslint-disable-next-line
  }, [type, JSON.stringify(labels), JSON.stringify(titles), JSON.stringify(datasets), money, percent]);
  return <div style={{ height: 220 }}><canvas ref={canvasRef}></canvas></div>;
}

/** A small editable list of names. With a `title` it is a card of its own; without one it sits inside a form. */
function ListManager({ title, items, onAdd, onRemove, placeholder, hint, renderExtra }) {
  const [name, setName] = useState('');
  const [error, setError] = useState('');
  async function submit() {
    const t = name.trim();
    if (!t) { setError('Escribe un nombre.'); return; }
    if (items.some((i) => i.toLowerCase() === t.toLowerCase())) { setError('Ya está en la lista.'); return; }
    const err = await onAdd(t);
    if (err) { setError(err.message); return; } // keep what was typed so it can be retried
    setError(''); setName('');
  }
  return (
    <div className={title ? 'card col g3' : 'col g3'} style={title ? undefined : { border: `1px solid ${C.line}`, borderRadius: 6, padding: 12 }}>
      {title ? <div><div style={{ fontSize: 15 }}>{title}</div>{hint ? <div className="xs soft">{hint}</div> : null}</div> : null}
      {items.length === 0 ? <div className="xs soft">Aún no hay nada.</div> : (
        <div className="row wrap g2">
          {items.map((p) => (
            <span key={p} className="row g1 xs" style={{ background: C.forestSoft, color: C.forest, borderRadius: 999, padding: '4px 8px' }}>
              {p}
              <button type="button" onClick={() => onRemove(p)} aria-label={`Quitar ${p}`} className="icon-btn" style={{ color: C.forest }}><Icon.X size={12} /></button>
            </span>
          ))}
        </div>
      )}
      <div className="row g2">
        <TextInput type="text" placeholder={placeholder} value={name} onChange={(e) => setName(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } }} />
        <Btn type="button" onClick={submit} accent={C.ink} style={{ color: C.paper }}>Agregar</Btn>
      </div>
      {error ? <div className="xs" style={{ color: C.clay }}>{error}</div> : null}
    </div>
  );
}

/* ---------- booking form (used for new entries on the Bookings tab and for edits on the Records tab) ---------- */

function BookingForm({ editing, bookings, channels, paymentMethods, onAdd, onSave, onDone, onCancel }) {
  const today = todayISO();
  const [f, setF] = useState(() => editing ? {
    guest: editing.guest, phone: editing.phone, guests: String(editing.guests), checkIn: editing.checkIn, checkOut: editing.checkOut,
    total: String(editing.total), channel: editing.channel, paymentMethod: editing.paymentMethod, notes: editing.notes,
  } : {
    guest: '', phone: '', guests: '2', checkIn: today, checkOut: addDays(today, 2),
    total: '', channel: channels[0] || '', paymentMethod: '', notes: '',
  });
  const [error, setError] = useState('');
  const [saving, setSaving] = useState(false);
  const set = (patch) => setF((p) => ({ ...p, ...patch }));

  const nights = f.checkIn && f.checkOut ? nightsBetween(f.checkIn, f.checkOut) : 0;
  const total = Number(f.total) || 0;
  const isWhole = (v, min) => v === '' || (Number.isInteger(Number(v)) && Number(v) >= min);

  async function submit(e) {
    e.preventDefault();
    if (!f.guest.trim() || !f.checkIn || !f.checkOut) { setError('Completa el nombre del huésped y las dos fechas.'); return; }
    if (nights < 1) { setError('La salida debe ser al menos un día después de la llegada.'); return; }
    if (!f.guests || !isWhole(f.guests, 1)) { setError('El número de huéspedes debe ser un número entero, 1 o más.'); return; }
    if (f.total === '' || !isWhole(f.total, 0)) { setError('Escribe el total como un número entero (0 o más).'); return; }
    const rec = {
      guest: f.guest.trim(), phone: f.phone.trim(), cabin: editing ? editing.cabin : CABIN, guests: Number(f.guests), checkIn: f.checkIn, checkOut: f.checkOut,
      total: Number(f.total), channel: f.channel, paymentMethod: f.paymentMethod, notes: f.notes.trim(),
    };
    const clash = findConflict(bookings, rec, editing ? editing.id : null);
    if (clash) { setError(`La cabaña ya está reservada del ${fmtShort(clash.checkIn)} al ${fmtShort(clash.checkOut)} (${clash.guest}). Elige otras fechas.`); return; }
    setError(''); setSaving(true);
    try {
      const err = editing ? await onSave(editing.id, rec) : await onAdd(rec);
      if (err) setError(err.message); // form stays open with everything still filled in
      else onDone();
    } finally { setSaving(false); }
  }

  return (
    <form onSubmit={submit} className="card col g4" style={{ maxWidth: 720 }}>
      <SectionTitle>{editing ? `Editar reserva — ${editing.guest}` : 'Nueva reserva'}</SectionTitle>
      <div className="row g4 stack-sm">
        <Field label="Nombre del huésped"><TextInput type="text" value={f.guest} onChange={(e) => set({ guest: e.target.value })} /></Field>
        <Field label="Teléfono / contacto" hint="Opcional"><TextInput type="text" value={f.phone} onChange={(e) => set({ phone: e.target.value })} /></Field>
      </div>
      <div className="row g4 stack-sm">
        <Field label="Huéspedes"><TextInput type="number" min="1" step="1" value={f.guests} onChange={(e) => set({ guests: e.target.value })} /></Field>
        <Field label="Canal">
          <Select value={f.channel} onChange={(e) => set({ channel: e.target.value })}>
            <option value="">—</option>
            {channels.map((c) => <option key={c} value={c}>{c}</option>)}
          </Select>
        </Field>
      </div>
      <div className="row g4 stack-sm">
        <Field label="Llegada"><TextInput type="date" value={f.checkIn} onChange={(e) => {
          const checkIn = e.target.value;
          set({ checkIn, ...(checkIn && f.checkOut <= checkIn ? { checkOut: addDays(checkIn, 1) } : {}) });
        }} /></Field>
        <Field label="Salida"><TextInput type="date" value={f.checkOut} min={f.checkIn ? addDays(f.checkIn, 1) : undefined} onChange={(e) => set({ checkOut: e.target.value })} /></Field>
      </div>
      <div className="row g4 stack-sm">
        <Field label="Total"><MoneyInput value={f.total} onChange={(e) => set({ total: e.target.value })} /></Field>
        <Field label="Medio de pago">
          <Select value={f.paymentMethod} onChange={(e) => set({ paymentMethod: e.target.value })}>
            <option value="">—</option>
            {/* a method removed from the list in Ajustes still shows on the bookings that used it */}
            {(f.paymentMethod && !paymentMethods.includes(f.paymentMethod) ? [...paymentMethods, f.paymentMethod] : paymentMethods).map((m) => <option key={m} value={m}>{m}</option>)}
          </Select>
        </Field>
      </div>
      <Field label="Notas" hint="Opcional: hora de llegada, mascotas, alergias, solicitudes especiales">
        <textarea value={f.notes} onChange={(e) => set({ notes: e.target.value })} style={{ ...inputStyle, minHeight: 64, resize: 'vertical' }} />
      </Field>
      <div className="small soft">
        {nights > 0 ? <>{plural(nights, 'noche', 'noches')}{total ? <> · unos <span className="tabular" style={{ color: C.ink }}>{fmtMoney(Math.round(total / nights))}</span> por noche</> : null}</> : 'Elige fechas válidas para ver el número de noches.'}
      </div>
      {error ? <div className="small" style={{ color: C.clay }}>{error}</div> : null}
      <div className="row g2" style={{ justifyContent: 'flex-end' }}>
        {onCancel ? <Btn type="button" kind="ghost" onClick={onCancel}>Cancelar</Btn> : null}
        <Btn type="submit" disabled={saving}>{saving ? <Icon.Loader size={14} className="spin" /> : editing ? <Icon.Check size={14} /> : <Icon.Plus size={14} />}{editing ? 'Guardar cambios' : 'Agregar reserva'}</Btn>
      </div>
    </form>
  );
}

/* ---------- expense form (Expenses tab for new entries, Records tab for edits) ---------- */

function ExpenseForm({ editing, categories, onAddCategory, onRemoveCategory, onAdd, onSave, onDone, onCancel }) {
  const [date, setDate] = useState(editing ? editing.date : todayISO());
  const [category, setCategory] = useState(editing ? editing.category : '');
  const [description, setDescription] = useState(editing ? editing.description : '');
  const [amount, setAmount] = useState(editing ? String(editing.amount) : '');
  const [spread, setSpread] = useState(!!(editing && editing.accrualMonths > 1));
  const [months, setMonths] = useState(editing && editing.accrualMonths > 1 ? String(editing.accrualMonths) : '');
  const [error, setError] = useState('');
  const [saving, setSaving] = useState(false);

  async function submit(e) {
    e.preventDefault();
    if (!date || !category || !description.trim() || !amount) { setError('Completa la fecha, la categoría, la descripción y el valor.'); return; }
    if (!Number.isInteger(Number(amount)) || Number(amount) <= 0) { setError('El valor debe ser un número entero mayor que cero.'); return; }
    if (spread && (!Number.isInteger(Number(months)) || Number(months) < 2)) { setError('Escribe 2 o más meses para repartir este gasto.'); return; }
    setError(''); setSaving(true);
    const rec = { date, category, description: description.trim(), amount: Number(amount), ...(spread ? { accrualMonths: Number(months) } : {}) };
    try {
      const err = editing ? await onSave(editing.id, rec) : await onAdd(rec);
      if (err) setError(err.message);
      else onDone();
    } finally { setSaving(false); }
  }
  return (
    <form onSubmit={submit} className="card col g4" style={{ maxWidth: 520 }}>
      <SectionTitle>{editing ? 'Editar gasto' : 'Nuevo gasto'}</SectionTitle>
      <Field label="Fecha"><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
      <ManagedSelect label="Categoría" value={category} onChange={(e) => setCategory(e.target.value)} items={categories}
        onAddItem={onAddCategory} onRemoveItem={onRemoveCategory} placeholder="Nombre de la nueva categoría" />
      <Field label="Descripción"><TextInput type="text" placeholder="p. ej. Entrega de leña, 2 cargas" value={description} onChange={(e) => setDescription(e.target.value)} /></Field>
      <Field label="Valor"><MoneyInput value={amount} onChange={(e) => setAmount(e.target.value)} /></Field>
      <div className="col g2" style={{ border: `1px solid ${C.line}`, borderRadius: 6, padding: 12 }}>
        <label className="row g2 small" style={{ cursor: 'pointer' }}>
          <input type="checkbox" checked={spread} onChange={(e) => setSpread(e.target.checked)} />
          Repartir en varios meses (seguro, arreglo del techo, electrodoméstico…)
        </label>
        {spread ? <Field label="Número de meses" hint={Number(months) >= 2 && Number(amount) > 0 ? `≈ ${fmtMoney(Math.floor(Number(amount) / Number(months)))} al mes desde el ${fmtDate(date)}` : undefined}>
          <TextInput type="number" min="2" step="1" placeholder="p. ej. 12" value={months} onChange={(e) => setMonths(e.target.value)} />
        </Field> : null}
      </div>
      {error ? <div className="small" style={{ color: C.clay }}>{error}</div> : null}
      <div className="row g2" style={{ justifyContent: 'flex-end' }}>
        {onCancel ? <Btn type="button" kind="ghost" onClick={onCancel}>Cancelar</Btn> : null}
        <Btn type="submit" disabled={saving} accent={C.clay}>{saving ? <Icon.Loader size={14} className="spin" /> : editing ? <Icon.Check size={14} /> : <Icon.Plus size={14} />}{editing ? 'Guardar cambios' : 'Agregar gasto'}</Btn>
      </div>
    </form>
  );
}

function RecordsTab({ bookings, expenses, channels, paymentMethods, categories, onAddCategory, onRemoveCategory,
  onSaveBooking, onSaveExpense, onRemoveBooking, onRemoveExpense, onExport, notify }) {
  const [type, setType] = useState('bookings');
  const [from, setFrom] = useState('');
  const [to, setTo] = useState('');
  const [category, setCategory] = useState('');
  const [search, setSearch] = useState('');
  const [editing, setEditing] = useState(null); // { type, rec }
  const q = search.toLowerCase();

  const bookingRows = useMemo(() => bookings.filter((b) => (!from || b.checkIn >= from) && (!to || b.checkIn <= to)
    && (!q || `${b.guest} ${b.phone} ${b.notes} ${b.channel}`.toLowerCase().includes(q))).sort((a, b) => b.checkIn.localeCompare(a.checkIn)), [bookings, from, to, q]);
  const expenseRows = useMemo(() => expenses.filter((e) => (!from || e.date >= from) && (!to || e.date <= to) && (!category || e.category === category)
    && (!q || `${e.category} ${e.description}`.toLowerCase().includes(q))).sort((a, b) => b.date.localeCompare(a.date)), [expenses, from, to, category, q]);

  function startEdit(t, rec) { setEditing({ t, rec }); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  const closeEdit = () => setEditing(null);
  const done = () => { closeEdit(); notify('Cambios guardados'); };

  if (editing && editing.t === 'bookings') {
    return <BookingForm key={editing.rec.id} editing={editing.rec} bookings={bookings} channels={channels} paymentMethods={paymentMethods}
      onSave={onSaveBooking} onDone={done} onCancel={closeEdit} />;
  }
  if (editing && editing.t === 'expenses') {
    return <ExpenseForm key={editing.rec.id} editing={editing.rec} categories={categories} onAddCategory={onAddCategory} onRemoveCategory={onRemoveCategory}
      onSave={onSaveExpense} onDone={done} onCancel={closeEdit} />;
  }

  const bookingTotals = bookingRows.reduce((s, b) => s + b.total, 0);
  const expenseTotal = expenseRows.reduce((s, e) => s + e.amount, 0);
  const filtered = !!(from || to || category || search);

  return (
    <div className="col g4">
      <div className="row g3 wrap">
        <div className="row" style={{ border: `1px solid ${C.line}`, borderRadius: 6, overflow: 'hidden' }}>
          {[['bookings', 'Reservas'], ['expenses', 'Gastos']].map(([id, label]) => (
            <button key={id} onClick={() => setType(id)} className="small" style={{ padding: '7px 14px', border: 'none', cursor: 'pointer', background: type === id ? C.forest : C.panel, color: type === id ? '#fff' : C.inkSoft }}>{label}</button>
          ))}
        </div>
        {type === 'expenses' ? <Select value={category} onChange={(e) => setCategory(e.target.value)} style={{ width: 'auto' }}><option value="">Todas las categorías</option>{categories.map((c) => <option key={c}>{c}</option>)}</Select> : null}
        <TextInput type="search" placeholder={type === 'bookings' ? 'Buscar huésped, teléfono, notas…' : 'Buscar descripción…'} value={search} onChange={(e) => setSearch(e.target.value)} style={{ width: 240 }} />
      </div>
      <div className="row between wrap g3">
        <DateRangeFilter from={from} to={to} onFromChange={setFrom} onToChange={setTo} />
        <span className="small soft">
          {type === 'bookings' ? `${plural(bookingRows.length, 'reserva', 'reservas')} · ${fmtMoney(bookingTotals)}` : `${plural(expenseRows.length, 'gasto', 'gastos')} · ${fmtMoney(expenseTotal)}`}
        </span>
      </div>
      <div className="xs soft" style={{ marginTop: -8 }}>{type === 'bookings' ? 'Las fechas filtran por el día de llegada.' : 'Las fechas filtran por el día en que se pagó el gasto.'}</div>

      {type === 'bookings' ? (
        bookingRows.length === 0 ? <EmptyState text={filtered ? 'Ninguna reserva coincide con estos filtros.' : 'Aún no hay reservas.'} /> : (
          <div className="card scroll-x" style={{ padding: '4px 16px' }}>
            <table>
              <thead><tr><th>Huésped</th><th>Estadía</th><th className="num">Total</th><th>Canal</th><th>Medio de pago</th><th></th></tr></thead>
              <tbody>
                {bookingRows.map((b) => {
                  return (
                    <tr key={b.id}>
                      <td><div>{b.guest}</div><div className="xs soft">{plural(b.guests, 'huésped', 'huéspedes')}{b.phone ? ` · ${b.phone}` : ''}</div>{b.notes ? <div className="xs soft" style={{ maxWidth: 240, whiteSpace: 'pre-wrap' }}>{b.notes}</div> : null}</td>
                      <td style={{ whiteSpace: 'nowrap' }}>{fmtShort(b.checkIn)} → {fmtShort(b.checkOut)}, {b.checkOut.slice(0, 4)}<div className="xs soft">{plural(bookingNights(b), 'noche', 'noches')} · unos {fmtMoney(bookingAvgNight(b))}/noche</div></td>
                      <td className="num tabular">{fmtMoney(b.total)}</td>
                      <td>{b.channel || <span className="soft">—</span>}</td>
                      <td>{b.paymentMethod || <span className="soft">—</span>}</td>
                      <td><RowActions onEdit={() => startEdit('bookings', b)} onDelete={() => { if (window.confirm(`¿Eliminar la reserva de ${b.guest}? No se puede deshacer.`)) onRemoveBooking(b.id); }} /></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )
      ) : (
        expenseRows.length === 0 ? <EmptyState text={filtered ? 'Ningún gasto coincide con estos filtros.' : 'Aún no hay gastos.'} /> : (
          <div className="card scroll-x" style={{ padding: '4px 16px' }}>
            <table>
              <thead><tr><th>Fecha</th><th>Categoría</th><th>Descripción</th><th className="num">Valor</th><th></th></tr></thead>
              <tbody>
                {expenseRows.map((e) => (
                  <tr key={e.id}>
                    <td style={{ whiteSpace: 'nowrap' }}>{fmtDate(e.date)}</td>
                    <td>{e.category}</td>
                    <td>{e.description}{e.accrualMonths > 1 ? <div className="xs soft">repartido en {e.accrualMonths} meses</div> : null}</td>
                    <td className="num tabular">{fmtMoney(e.amount)}</td>
                    <td><RowActions onEdit={() => startEdit('expenses', e)} onDelete={() => { if (window.confirm('¿Eliminar este gasto?')) onRemoveExpense(e.id); }} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )
      )}
      <div><Btn kind="ghost" onClick={onExport}><Icon.Download size={14} /> Exportar todo a Excel</Btn></div>
    </div>
  );
}

/* ---------- dashboard tab ---------- */

/** Weekly / Monthly / Yearly switch shown on a chart's title row. */
function PeriodToggle({ value, onChange }) {
  return (
    <div className="row" style={{ border: `1px solid ${C.line}`, borderRadius: 6, overflow: 'hidden' }}>
      {PERIODS.map(([id, label]) => (
        <button key={id} type="button" onClick={() => onChange(id)} className="xs"
          style={{ padding: '5px 10px', border: 'none', cursor: 'pointer', background: value === id ? C.forest : C.panel, color: value === id ? '#fff' : C.inkSoft }}>{label}</button>
      ))}
    </div>
  );
}

function DashboardTab({ bookings, expenses }) {
  const today = todayISO();
  const thisYear = today.slice(0, 4);
  const [from, setFrom] = useState(`${thisYear}-01-01`);
  const [to, setTo] = useState(`${thisYear}-12-31`);
  const [revPeriod, setRevPeriod] = useState('month');
  const [occPeriod, setOccPeriod] = useState('month');
  const y = useMemo(() => computeRange(bookings, expenses, from, to, 1, today), [bookings, expenses, from, to, today]);
  const revY = useMemo(() => computeRange(bookings, expenses, from, to, 1, today, revPeriod), [bookings, expenses, from, to, today, revPeriod]);
  const occY = useMemo(() => computeRange(bookings, expenses, from, to, 1, today, occPeriod), [bookings, expenses, from, to, today, occPeriod]);

  const presets = (
    <div className="row g3">
      <button type="button" className="btn-link" onClick={() => { setFrom(`${thisYear}-01-01`); setTo(`${thisYear}-12-31`); }}>Este año</button>
      <button type="button" className="btn-link" onClick={() => { setFrom(addDays(today, -364)); setTo(today); }}>Últimos 12 meses</button>
    </div>
  );

  return (
    <div className="col g6">
      <div className="col g1">
        <DateRangeFilter from={from} to={to} onFromChange={setFrom} onToChange={setTo} presets={presets} />
        {!from && !to ? <div className="xs soft">Mostrando todo lo registrado.</div> : null}
      </div>
      {!y ? <EmptyState text="La fecha “Desde” debe ser igual o anterior a la fecha “Hasta”." /> : <>
        <div className="row g3 wrap">
          <KpiCard label="Ingresos" value={fmtMoney(y.revenue)} sub="Noches reservadas en este periodo" accent={C.forest} />
          <KpiCard label="Gastos" value={fmtMoney(y.expenses)} sub="Gastos repartidos, contados por mes" accent={C.clay} />
          <KpiCard label="Neto" value={fmtMoney(y.revenue - y.expenses)} sub="Ingresos − gastos" accent={y.revenue - y.expenses >= 0 ? C.forest : C.clay} />
          <KpiCard label="Ocupación" value={y.occupancy === null ? '—' : `${y.occupancy}%`} sub={`${plural(y.nightsToDate, 'noche vendida', 'noches vendidas')} hasta hoy`} accent={C.timber} />
          <KpiCard label="Tarifa promedio por noche" value={y.adr === null ? '—' : fmtMoney(y.adr)} sub="Por noche vendida" accent={C.timber} />
        </div>
        <div className="row g4 wrap" style={{ alignItems: 'stretch' }}>
          <div className="card grow" style={{ minWidth: 300 }}>
            <SectionTitle right={<PeriodToggle value={revPeriod} onChange={setRevPeriod} />}>Ingresos vs gastos</SectionTitle>
            <ChartCanvas type="bar" money labels={revY.labels} titles={revY.titles} datasets={[{ label: 'Ingresos', values: revY.rev, color: C.forest }, { label: 'Gastos', values: revY.exp, color: C.clay }]} />
          </div>
          <div className="card grow" style={{ minWidth: 300 }}>
            <SectionTitle right={<PeriodToggle value={occPeriod} onChange={setOccPeriod} />}>Ocupación</SectionTitle>
            <ChartCanvas type="line" percent labels={occY.labels} titles={occY.titles} datasets={[{ label: 'Ocupación', values: occY.occ, color: C.timber }]} />
            <div className="xs soft" style={{ marginTop: 6 }}>Incluye reservas que aún no llegan.</div>
          </div>
        </div>
        <div className="card">
          <SectionTitle>Reservas por canal</SectionTitle>
          {y.byChannel.length === 0 ? <div className="small soft">No hay reservas en este periodo.</div> : (
            <ChartCanvas type="bar" money labels={y.byChannel.map(([name]) => name)} datasets={[{ label: 'Total de reservas', values: y.byChannel.map(([, v]) => v), color: C.timber }]} />
          )}
        </div>
      </>}
    </div>
  );
}

/* ---------- settings tab ---------- */

function SettingsTab({ channels, paymentMethods, onExport, onBackup, onRestore }) {
  const fileRef = useRef(null);
  return (
    <div className="col g4" style={{ maxWidth: 720 }}>
      <ListManager title="Canales de reserva" hint="De dónde llegan las reservas." items={channels[0]} onAdd={channels[1]} onRemove={channels[2]} placeholder="p. ej. Facebook" />
      <ListManager title="Medios de pago" hint="Cómo te pagan las reservas." items={paymentMethods[0]} onAdd={paymentMethods[1]} onRemove={paymentMethods[2]} placeholder="p. ej. Bre-B" />
      <div className="card col g3">
        <div style={{ fontSize: 15 }}>Datos</div>
        <div className="small soft">
          {sb ? 'Conectado a tu proyecto de Supabase: los datos se comparten entre todos los dispositivos.'
            : 'Modo local: todo se guarda solo en este navegador, en este equipo. Descarga una copia de seguridad con frecuencia y usa un proyecto de Supabase (ver CABIN_NOTES.md) para compartir los datos entre dispositivos.'}
        </div>
        <div className="row g2 wrap">
          <Btn kind="ghost" onClick={onExport}><Icon.Download size={14} /> Exportar a Excel</Btn>
          {!sb ? <>
            <Btn kind="ghost" onClick={onBackup}><Icon.Download size={14} /> Descargar copia (.json)</Btn>
            <Btn kind="ghost" onClick={() => fileRef.current && fileRef.current.click()}><Icon.Upload size={14} /> Restaurar copia</Btn>
            <input ref={fileRef} type="file" accept="application/json,.json" style={{ display: 'none' }} onChange={(e) => { const f = e.target.files[0]; e.target.value = ''; if (f) onRestore(f); }} />
          </> : null}
        </div>
      </div>
    </div>
  );
}

/* ---------- login (Supabase mode only) ---------- */

function Login() {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  async function submit(e) {
    e.preventDefault(); setBusy(true); setError('');
    const { error: err } = await sb.auth.signInWithPassword({ email: email.trim(), password });
    if (err) setError(errMsg(err));
    setBusy(false);
  }
  return (
    <div className="row" style={{ minHeight: '100vh', justifyContent: 'center', padding: 16 }}>
      <form onSubmit={submit} className="card col g4" style={{ width: '100%', maxWidth: 360 }}>
        <h1 className="serif" style={{ margin: 0, fontSize: 24, fontWeight: 400 }}>{APP_NAME}</h1>
        <Field label="Correo electrónico"><TextInput type="email" autoComplete="username" value={email} onChange={(e) => setEmail(e.target.value)} /></Field>
        <Field label="Contraseña"><TextInput type="password" autoComplete="current-password" value={password} onChange={(e) => setPassword(e.target.value)} /></Field>
        {error ? <div className="small" style={{ color: C.clay }}>{error}</div> : null}
        <Btn type="submit" disabled={busy}>{busy ? <Icon.Loader size={14} className="spin" /> : null}Iniciar sesión</Btn>
      </form>
    </div>
  );
}

/* ---------- app shell ---------- */

function Main({ session }) {
  const [tab, setTab] = useState('dashboard');
  const [toast, setToast] = useState('');
  const toastTimer = useRef(null);
  const notify = useCallback((text) => { setToast(text); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToast(''), 4000); }, []);

  // Connectivity + load-failure state. `tick` re-runs every load (Retry button, or the browser coming back online).
  const [online, setOnline] = useState(navigator.onLine);
  const [tick, setTick] = useState(0);
  const [loadErrors, setLoadErrors] = useState({});
  const reportLoad = useCallback((key, msg) => setLoadErrors((p) => ((p[key] || '') === msg ? p : { ...p, [key]: msg })), []);
  useEffect(() => {
    const on = () => { setOnline(true); setTick((t) => t + 1); };
    const off = () => setOnline(false);
    window.addEventListener('online', on); window.addEventListener('offline', off);
    return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
  }, []);
  const loadProblem = Object.values(loadErrors).find(Boolean);

  const bookings = useTable('bookings', bookingFromDb, bookingToDb, 'check_in', notify, reportLoad, tick);
  const expenses = useTable('expenses', expenseFromDb, expenseToDb, 'date', notify, reportLoad, tick);
  const paymentMethods = useConfigList('payment_methods', notify, reportLoad, tick);
  const channels = useConfigList('channels', notify, reportLoad, tick);
  const categories = useConfigList('categories', notify, reportLoad, tick);
  const refreshAll = () => setTick((t) => t + 1);
  const goTab = (id) => { setTab(id); window.scrollTo({ top: 0 }); };

  function exportExcel() {
    const wb = XLSX.utils.book_new();
    const add = (name, rows) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{}]), name);
    add('Reservas', bookings.items.map((b) => ({ 'Huésped': b.guest, 'Teléfono': b.phone, Llegada: b.checkIn, Salida: b.checkOut, Noches: bookingNights(b), 'Huéspedes': b.guests, Total: b.total, Canal: b.channel, 'Medio de pago': b.paymentMethod, Notas: b.notes })));
    add('Gastos', expenses.items.map((e) => ({ Fecha: e.date, 'Categoría': e.category, 'Descripción': e.description, Valor: e.amount, 'Repartido en meses': e.accrualMonths || '' })));
    add('Gastos (por mes)', expenses.items.flatMap((e) => explodeExpense(e).map((s) => ({ Mes: s.month, Fecha: s.date, 'Categoría': e.category, 'Descripción': e.description, Valor: s.amount }))));
    XLSX.writeFile(wb, `cabin-ledger-${todayISO()}.xlsx`);
  }
  function downloadBackup() {
    const dump = {}; LOCAL_KEYS.forEach((k) => { dump[k] = lsRead(k, k === 'config' ? {} : []); });
    triggerDownload(new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' }), `cabin-ledger-backup-${todayISO()}.json`);
  }
  async function restoreBackup(file) {
    try {
      const dump = JSON.parse(await file.text());
      if (!LOCAL_KEYS.some((k) => k in dump)) throw new Error('not a backup');
      if (!window.confirm('Restaurar reemplaza todo lo que está guardado en este navegador. ¿Continuar?')) return;
      LOCAL_KEYS.forEach((k) => { if (k in dump) lsWrite(k, dump[k]); });
      window.location.reload();
    } catch (e) { notify('Ese archivo no es una copia de seguridad de Cabin Ledger.'); }
  }

  return (
    <div className="app-main" style={{ maxWidth: 1100, margin: '0 auto', padding: '0 16px 64px' }}>
      <header className="row between wrap g3" style={{ padding: '20px 0 12px' }}>
        <div>
          <h1 className="serif" style={{ margin: 0, fontSize: 26, fontWeight: 400 }}>{APP_NAME}</h1>
          <div className="xs soft">{sb ? `Sesión iniciada como ${session.user.email}` : 'Modo local · datos guardados en este navegador'}</div>
        </div>
        <div className="row g2">
          <Btn kind="ghost" onClick={refreshAll}><Icon.Refresh size={14} /> Actualizar</Btn>
          {sb ? <Btn kind="ghost" onClick={() => sb.auth.signOut()}>Cerrar sesión</Btn> : null}
        </div>
      </header>
      <nav className="tabs top-tabs" style={{ marginBottom: 20 }}>
        {NAV.map((n) => { const I = Icon[n.icon]; return <button key={n.id} className={`tab${tab === n.id ? ' active' : ''}`} onClick={() => goTab(n.id)}><I size={15} />{n.label}</button>; })}
      </nav>
      {sb && !online ? <div className="banner" role="alert" style={{ background: C.timberSoft, color: C.ink }}>Estás sin conexión. No se puede guardar nada hasta que vuelva el internet.</div> : null}
      {loadProblem ? (
        <div className="banner" role="alert" style={{ background: C.claySoft, color: C.clay }}>
          <span>{loadProblem} Lo que ves puede estar incompleto: no agregues registros hasta que esto se resuelva.</span>
          <button type="button" className="btn-link" style={{ color: C.clay, fontSize: 13, textDecoration: 'underline' }} onClick={refreshAll}>Reintentar</button>
        </div>
      ) : null}
      {tab === 'dashboard' ? <DashboardTab bookings={bookings.items} expenses={expenses.items} /> : null}
      {tab === 'bookings' ? <BookingsTab bookings={bookings.items} channels={channels[0]} paymentMethods={paymentMethods[0]} onAdd={bookings.add} notify={notify} /> : null}
      {tab === 'expenses' ? <ExpensesTab categories={categories[0]} onAddCategory={categories[1]} onRemoveCategory={categories[2]} onAdd={expenses.add} notify={notify} /> : null}
      {tab === 'records' ? <RecordsTab bookings={bookings.items} expenses={expenses.items} channels={channels[0]} paymentMethods={paymentMethods[0]}
        categories={categories[0]} onAddCategory={categories[1]} onRemoveCategory={categories[2]}
        onSaveBooking={bookings.save} onSaveExpense={expenses.save} onRemoveBooking={bookings.remove} onRemoveExpense={expenses.remove} onExport={exportExcel} notify={notify} /> : null}
      {tab === 'settings' ? <SettingsTab channels={channels} paymentMethods={paymentMethods} onExport={exportExcel} onBackup={downloadBackup} onRestore={restoreBackup} /> : null}
      {toast ? <div className="toast" role="status" style={{ position: 'fixed', bottom: 20, right: 20, background: C.ink, color: C.paper, padding: '8px 14px', borderRadius: 6, fontSize: 13, maxWidth: 360 }}>{toast}</div> : null}
      <nav className="bottom-nav" aria-label="Principal">
        {NAV.map((n) => { const I = Icon[n.icon]; return <button key={n.id} type="button" onClick={() => goTab(n.id)} style={{ color: tab === n.id ? C.forest : C.inkSoft }}><I size={20} />{n.label}</button>; })}
      </nav>
    </div>
  );
}

function App() {
  const [session, setSession] = useState(undefined); // undefined = still checking
  useEffect(() => {
    if (!sb) { setSession(null); return; }
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => data.subscription.unsubscribe();
  }, []);
  if (session === undefined) return <EmptyState text="Cargando…" />;
  if (sb && !session) return <Login />;
  return <Main session={session} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  // Installable app: the service worker only caches the CDN libraries (see sw.js), never the page or your data.
  // It needs https (or localhost); on a plain file:// open the registration is skipped silently.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
